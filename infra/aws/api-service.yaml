AWSTemplateFormatVersion: '2010-09-09'
Description: Caribe Records production API on AWS App Runner

Parameters:
  ImageIdentifier:
    Type: String
    Description: Full ECR image URI, including an immutable tag
  FrontendOrigin:
    Type: String
    Description: Public Amplify or custom-domain origin, without trailing slash
  MongoUriParameterArn:
    Type: String
  SessionSecretParameterArn:
    Type: String
  CloudinaryCloudNameParameterArn:
    Type: String
  CloudinaryApiKeyParameterArn:
    Type: String
  CloudinaryApiSecretParameterArn:
    Type: String
  ResendApiKeyParameterArn:
    Type: String

Resources:
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  ApiInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadCaribeParameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource:
                  - !Ref MongoUriParameterArn
                  - !Ref SessionSecretParameterArn
                  - !Ref CloudinaryCloudNameParameterArn
                  - !Ref CloudinaryApiKeyParameterArn
                  - !Ref CloudinaryApiSecretParameterArn
                  - !Ref ResendApiKeyParameterArn

  ApiService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: caribe-records-api-production
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '3000'
            RuntimeEnvironmentVariables:
              - Name: NODE_ENV
                Value: production
              - Name: PORT
                Value: '3000'
              - Name: CORS_ORIGINS
                Value: !Ref FrontendOrigin
              - Name: APP_URL
                Value: !Ref FrontendOrigin
              - Name: SESSION_COOKIE_NAME
                Value: caribe.sid
              - Name: SESSION_IDLE_MINUTES
                Value: '5'
              - Name: SESSION_SECURE
                Value: 'true'
              - Name: SESSION_SAME_SITE
                Value: lax
              - Name: TRUST_PROXY
                Value: 'true'
            RuntimeEnvironmentSecrets:
              - Name: MONGODB_URI
                Value: !Ref MongoUriParameterArn
              - Name: SESSION_SECRET
                Value: !Ref SessionSecretParameterArn
              - Name: CLOUDINARY_CLOUD_NAME
                Value: !Ref CloudinaryCloudNameParameterArn
              - Name: CLOUDINARY_API_KEY
                Value: !Ref CloudinaryApiKeyParameterArn
              - Name: CLOUDINARY_API_SECRET
                Value: !Ref CloudinaryApiSecretParameterArn
              - Name: RESEND_API_KEY
                Value: !Ref ResendApiKeyParameterArn
      InstanceConfiguration:
        Cpu: 0.25 vCPU
        Memory: 0.5 GB
        InstanceRoleArn: !GetAtt ApiInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: DEFAULT
      ObservabilityConfiguration:
        ObservabilityEnabled: false

Outputs:
  ApiServiceArn:
    Value: !GetAtt ApiService.ServiceArn
  ApiServiceUrl:
    Value: !Sub https://${ApiService.ServiceUrl}
