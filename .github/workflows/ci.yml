name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=high

  api-container:
    name: API container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag caribe-records-api:ci api

  web-quality:
    name: Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build QA configuration
        run: npm run build -- --mode test
      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=high

  pull-request-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate title and branch name
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|ci|test|refactor|chore|perf|build)(\([a-z0-9._/-]+\))?\!?:\ .+ ]]; then
            echo "Use a Conventional Commit title, for example: fix(auth): reject inactive users"
            exit 1
          fi
          if [[ "$HEAD_REF" != codex/* && "$HEAD_REF" != "develop" ]]; then
            echo "Branches must use codex/*; production releases come from develop"
            exit 1
          fi

  production-source:
    name: Production source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Accept integration, release, or hotfix branches
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "develop" && "$HEAD_REF" != codex/release-* && "$HEAD_REF" != codex/hotfix-* ]]; then
            echo "Production PRs must come from develop, codex/release-*, or codex/hotfix-*"
            exit 1
          fi

  browser-qa:
    name: CMS and responsive browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: npm ci --prefix api && npm ci --prefix web && npm run build --prefix web
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/caribe-qa" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/caribe-qa/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Test production build with disposable content
        run: NODE_PATH="$RUNNER_TEMP/caribe-qa/node_modules" node api/scripts/review-browser.cjs
      - name: Test consent and audience measurement with intercepted requests
        run: |
          npm run build --prefix web -- --mode analytics-test
          NODE_PATH="$RUNNER_TEMP/caribe-qa/node_modules" node api/scripts/review-analytics.cjs

  platform-layout:
    name: Public layout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: npm ci && npm run build
      - name: Check rendered fonts and responsive artist layout
        run: |
          npm install --prefix "$RUNNER_TEMP/caribe-qa" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/caribe-qa/node_modules/playwright/cli.js" install chromium
          NODE_PATH="$RUNNER_TEMP/caribe-qa/node_modules" node ../api/scripts/check-platform-layout.cjs
