name: Deploy production API

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push_only:
        description: Push the image without updating Lambda (first deployment only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: caribe-records-api
  LAMBDA_FUNCTION: caribe-records-api-production

jobs:
  deploy:
    name: Build and deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 --tag "$IMAGE_URI" api
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda
        if: github.event_name == 'push' || inputs.push_only != true
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_URI" \
            --no-cli-pager
          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION"

      - name: Deployment summary
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: echo "Deployed image $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
