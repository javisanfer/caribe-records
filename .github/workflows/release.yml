name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Verify API
        working-directory: api
        run: npm ci && npm test && npm audit --omit=dev --audit-level=high
      - name: Verify and build web
        working-directory: web
        run: npm ci && npm run lint && npm run build && npm audit --omit=dev --audit-level=high
      - name: Package web artifact
        run: tar -czf caribe-web-${{ github.ref_name }}.tar.gz -C web/dist .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "caribe-web-${{ github.ref_name }}.tar.gz" --generate-notes --verify-tag
