applications:
  - appRoot: web
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: X-Frame-Options
            value: SAMEORIGIN
          - key: Content-Security-Policy
            value: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
      - pattern: '/assets/**/*'
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      - pattern: '/admin/**/*'
        headers:
          - key: X-Robots-Tag
            value: noindex, nofollow
          - key: Referrer-Policy
            value: no-referrer
